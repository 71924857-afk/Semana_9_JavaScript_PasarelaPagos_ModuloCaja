<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LogísticaMax Perú - Pasarela de Pago</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Neutralizar contenedores estáticos blancos antiguos */
    main, .card, container, #detalle-cotizacion {
      background: transparent !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body style="background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; flex-direction: column; margin: 0;">

  <!-- Header / Menú Principal -->
  <header style="background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 100; padding: 15px 5%;">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" style="text-decoration: none; font-size: 1.4rem; font-weight: 800; color: #ffffff; display: flex; align-items: center; gap: 8px;">
        <i class="fas fa-truck-moving" style="color: #f97316;"></i> LogísticaMax <span style="color: #f97316;">Perú</span>
      </a>

      <nav style="display: flex; gap: 15px; align-items: center;">
        <a href="index.html" style="color: #cbd5e1; text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 6px 12px; border-radius: 6px;"><i class="fas fa-home"></i> Inicio</a>
        <a href="registro.html" style="color: #cbd5e1; text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 6px 12px; border-radius: 6px;"><i class="fas fa-calculator"></i> Cotizador</a>
        <a href="consulta.html" style="color: #cbd5e1; text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 6px 12px; border-radius: 6px;"><i class="fas fa-search"></i> Seguimiento</a>
        <a href="pasarela.html" style="color: #ffffff; background: rgba(255,255,255,0.1); text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 6px 12px; border-radius: 6px;"><i class="fas fa-credit-card"></i> Pagar Flete</a>
        <a href="caja.html" style="color: #cbd5e1; text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 6px 12px; border-radius: 6px;"><i class="fas fa-cash-register"></i> Caja</a>
      </nav>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main style="flex: 1; max-width: 800px; width: 90%; margin: 30px auto;">
    
    <!-- Botón Volver Atrás y Encabezado -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
      <a href="consulta.html" style="color: #cbd5e1; text-decoration: none; font-weight: 700; font-size: 0.9rem; padding: 10px 18px; border-radius: 10px; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; gap: 8px; backdrop-filter: blur(10px); transition: all 0.2s;">
        <i class="fas fa-arrow-left" style="color: #f97316;"></i> Volver a Mis Envíos
      </a>

      <div style="background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.3); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; color: #4ade80; font-weight: 700; display: flex; align-items: center; gap: 6px;">
        <i class="fas fa-lock"></i> Conexión Cifrada SSL
      </div>
    </div>

    <!-- Contenedor dinámico de la Pasarela -->
    <div id="detalle-cotizacion">
      <div style="text-align: center; padding: 60px; color: #94a3b8;">
        <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: #f97316; margin-bottom: 15px;"></i>
        <p style="font-size: 1rem;">Cargando datos de la cotización...</p>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer style="background: #090d16; border-top: 1px solid rgba(255,255,255,0.05); padding: 20px; text-align: center; color: #64748b; font-size: 0.85rem; margin-top: auto;">
    <p>&copy; 2026 LogísticaMax Perú. Todos los derechos reservados. | Pasarela Segura de Pagos</p>
  </footer>

  <script type="module" src="js/pago/pasarela.js"></script>
</body>
</html>
