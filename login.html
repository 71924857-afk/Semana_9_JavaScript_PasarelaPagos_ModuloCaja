<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | LogísticaMax Perú</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e293b 100%); color: #f8fafc; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; flex-direction: column; margin: 0; position: relative; overflow-x: hidden;">

  <!-- Fondo de imagen logística con overlay oscuro -->
  <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat; opacity: 0.15; pointer-events: none; z-index: 0;"></div>

  <!-- Header Simplificado -->
  <header style="position: relative; z-index: 10; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 18px 5%;">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" style="text-decoration: none; font-size: 1.4rem; font-weight: 800; color: #ffffff; display: flex; align-items: center; gap: 10px;">
        <i class="fas fa-truck-moving" style="color: #f97316;"></i> LogísticaMax <span style="color: #f97316;">Perú</span>
      </a>

      <a href="index.html" style="color: #cbd5e1; text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 8px 16px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s; display: flex; align-items: center; gap: 8px;">
        <i class="fas fa-arrow-left"></i> Volver al Inicio
      </a>
    </div>
  </header>

  <!-- Contenedor Principal / Tarjeta de Login -->
  <main style="position: relative; z-index: 10; flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    
    <div style="width: 100%; max-width: 420px; background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; padding: 35px 30px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);">
      
      <!-- Icono y Título -->
      <div style="text-align: center; margin-bottom: 30px;">
        <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #f97316, #ea580c); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; box-shadow: 0 8px 20px rgba(249, 115, 22, 0.35);">
          <i class="fas fa-user-lock" style="font-size: 1.6rem; color: #ffffff;"></i>
        </div>
        <h2 style="margin: 0; font-size: 1.6rem; font-weight: 800; color: #ffffff; letter-spacing: -0.5px;">Iniciar Sesión</h2>
        <p style="margin: 8px 0 0 0; color: #94a3b8; font-size: 0.9rem;">Ingresa tus credenciales para gestionar tus envíos y cotizaciones</p>
      </div>

      <!-- Formulario de Acceso -->
      <form id="form-login" style="display: flex; flex-direction: column; gap: 18px;">
        <div>
          <label for="email" style="display: block; font-size: 0.85rem; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">
            Correo Electrónico
          </label>
          <div style="position: relative;">
            <i class="fas fa-envelope" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 0.95rem;"></i>
            <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required style="width: 100%; box-sizing: border-box; padding: 12px 14px 12px 40px; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; color: #ffffff; font-size: 0.95rem; outline: none; transition: border 0.2s;">
          </div>
        </div>

        <div>
          <label for="password" style="display: block; font-size: 0.85rem; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">
            Contraseña
          </label>
          <div style="position: relative;">
            <i class="fas fa-lock" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 0.95rem;"></i>
            <input type="password" id="password" name="password" placeholder="••••••••" required style="width: 100%; box-sizing: border-box; padding: 12px 14px 12px 40px; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; color: #ffffff; font-size: 0.95rem; outline: none; transition: border 0.2s;">
          </div>
        </div>

        <button type="submit" id="btn-ingresar" style="margin-top: 10px; background: linear-gradient(135deg, #f97316, #ea580c); color: #ffffff; padding: 14px; border: none; border-radius: 10px; font-weight: 800; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3); transition: transform 0.2s, box-shadow 0.2s;">
          <i class="fas fa-right-to-bracket"></i> Ingresar
        </button>
      </form>

      <!-- Mensaje de respuesta -->
      <p id="mensaje-login" style="text-align: center; font-weight: 600; font-size: 0.9rem; margin-top: 15px; min-height: 20px;"></p>

      <!-- Link de Registro -->
      <div style="text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 0.9rem; color: #94a3b8;">
        ¿No tienes una cuenta? <a href="registro.html" style="color: #f97316; font-weight: 700; text-decoration: none;">Registrarte aquí</a>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer style="position: relative; z-index: 10; background: #090d16; border-top: 1px solid rgba(255,255,255,0.05); padding: 18px; text-align: center; color: #64748b; font-size: 0.85rem;">
    <p style="margin: 0;">&copy; 2026 LogísticaMax Perú. Todos los derechos reservados.</p>
  </footer>

  <script type="module" src="js/auth/login.js"></script>
</body>
</html>
