<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizar Envío - LogísticaMax Perú</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #0f172a;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
    }
    header h1 span {
      color: #f97316;
    }
    .btn-volver {
      background-color: #334155;
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    .btn-volver:hover {
      background-color: #475569;
    }
    main {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
    }
    .card {
      background-color: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid #e2e8f0;
    }
    .card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 24px;
      padding-bottom: 8px;
      border-bottom: 2px solid #f97316;
      display: inline-block;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #f97316;
    }
    .form-acciones {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }
    .btn-guardar {
      background-color: #f97316;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      flex: 1;
    }
    .btn-guardar:hover {
      background-color: #ea580c;
    }
    .btn-cancelar {
      background-color: #64748b;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      transition: background-color 0.2s;
      flex: 1;
    }
    .btn-cancelar:hover {
      background-color: #475569;
    }
    #mensaje {
      margin-top: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
    }
    footer {
      text-align: center;
      padding: 20px;
      background-color: #0f172a;
      color: #94a3b8;
      font-size: 0.85rem;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <h1>LogísticaMax <span>Perú</span></h1>
    <a href="consulta.html" class="btn-volver">← Volver a Mis Envíos</a>
  </header>

  <main>
    <div class="card">
      <h2>Actualizar Información de Envío</h2>
      
      <form id="form-actualizar">
        <div class="form-group">
          <label for="destinatario">Destinatario:</label>
          <input type="text" id="destinatario" placeholder="Nombre del destinatario" required>
        </div>

        <div class="form-group">
          <label for="destino">Destino:</label>
          <input type="text" id="destino" placeholder="Ciudad o dirección de destino" required>
        </div>

        <div class="form-group">
          <label for="peso">Peso (Kg):</label>
          <input type="number" id="peso" step="0.1" placeholder="0.0" required>
        </div>

        <div class="form-acciones">
          <button type="submit" id="btn-guardar" class="btn-guardar">Guardar Cambios</button>
          <a href="consulta.html" class="btn-cancelar">Cancelar</a>
        </div>

        <div id="mensaje"></div>
      </form>
    </div>
  </main>

  <footer>
    <p>© 2026 LogísticaMax Perú. Todos los derechos reservados.</p>
  </footer>

  <script type="module" src="./js/actualizar/actualizar.js"></script>
</body>
</html>
